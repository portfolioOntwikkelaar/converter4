<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¨¨¨</title>
    <style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

  body {
    font-family: 'Arial', sans-serif;
    background: radial-gradient(circle at center, #0b0c1b 0%, #020214 80%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    color: #ff1a1a;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #0e0f23;
    border-radius: 20px;
    padding: 30px;
    max-width: 700px;
    width: 90%;
    box-shadow:
      0 0 10px #ff0000aa,
      0 0 20px #ff0000cc,
      0 0 40px #ff0000dd,
      0 0 80px #ff0000ff;
  }

  textarea {
    width: 100%;
    height: 160px;
    background: #1a1a2e;
    border: 2px solid #ff1a1a;
    border-radius: 15px;
    padding: 15px;
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    color: #ff3333;
    box-shadow:
      inset 0 0 8px #ff1a1a,
      0 0 15px #ff1a1a;
    resize: none;
    outline: none;
  }

  #output {
    margin-top: 20px;
    width: 100%;
    min-height: 160px;
    background: #1a1a2e;
    border: 2px solid #ff1a1a;
    border-radius: 15px;
    padding: 15px;
    font-family: 'Orbitron', monospace;
    font-size: 16px;
    color: #FFCC33;
    box-shadow:
      inset 0 0 8px #ff1a1a,
      0 0 15px #ff1a1a;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  button {
    margin-top: 20px;
    padding: 15px 40px;
    background: #FFCC33;
    border: none;
    border-radius: 30px;
    color: #FFCC33;
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow:
  0 0 10px #FFAA00,
  0 0 20px #FFCC33,
  0 0 40px #FFCC33,
  0 0 80px #FFAA00;
    transition: all 0.3s ease;
  }

  button:hover {
  background: radial-gradient(circle at center, #FFCC33, #FF9900);
  box-shadow:
    0 0 15px #FFCC33,
    0 0 30px #FFCC33,
    0 0 45px #FF9900,
    0 0 60px #FF6600;
}
</style>
</head>
<body>
  <div class="container">
    <h2>-+-</h2>
    <p>.......</p>

    <!-- Input Textarea -->
    <textarea id="inputText" placeholder="....."></textarea>

    <!-- Button to trigger cleanup -->
    <button onclick="removeText()">§</button>

    <!-- Output area where cleaned text will be shown -->
    <div id="output" aria-live="polite" aria-label="Output monitor">!!!!!</div>
  </div>

  <script>
    function removeText() {
      const inputText = document.getElementById('inputText').value;

      let cleanedText = inputText
        .replace(/check_box_outline_blank\s*/g, ',') // Remove 'check_box_outline_blank' and spaces
        .replace(/radio_button_checked\s*/g, ',')   // Same for 'radio_button_checked'
        .replace(/radio_button_unchecked\s*/g, ',') // Same for 'radio_button_unchecked'
        .replace(/\s{2,}/g, ' ')                     // Multiple spaces to one
        .replace(/^\s+|\s+$/gm, '')                  // Trim spaces at start/end of each line
        .replace(/\n{2,}/g, '\n')                    // Multiple blank lines to one
        .trim();

      document.getElementById('output').textContent = cleanedText;
    }
  </script>
</body>
</html>
